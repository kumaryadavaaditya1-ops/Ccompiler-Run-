<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online C Compiler</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">
        <h1>Online C Compiler</h1>
        <p>Write, Compile and Run C Code</p>

        <textarea id="code" placeholder="Write your C code here...">#include <stdio.h>

int main() {
    printf("Hello World!");
    return 0;
}</textarea>

        <button onclick="runCode()">▶ Run Code</button>

        <h3>Output:</h3>
        <pre id="output"></pre>
    </div>

    <script src="script.js"></script>

</body>
</html>
