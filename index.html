<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="google-site-verification" content="yrehLwDZqLyOYerATvWq6pBE7BnoJPGLg83RvQYj-W4" />
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online C Compiler</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <h1>Online C Compiler</h1>
    <p>Write, Compile and Run C Code</p>

    <textarea id="code">#include <stdio.h>

int main() {
    printf("Hello World!");
    return 0;
}</textarea>

    <div class="symbol-keyboard">
        <button onclick="insertSymbol('{')">{</button>
        <button onclick="insertSymbol('}')">}</button>
        <button onclick="insertSymbol('(')">(</button>
        <button onclick="insertSymbol(')')">)</button>
        <button onclick="insertSymbol('[')">[</button>
        <button onclick="insertSymbol(']')">]</button>
        <button onclick="insertSymbol(';')">;</button>
        <button onclick="insertSymbol(',')">,</button>
        <button onclick="insertSymbol('.')">.</button>
        <button onclick="insertSymbol('#')">#</button>
        <button onclick="insertSymbol('&lt;')">&lt;</button>
        <button onclick="insertSymbol('&gt;')">&gt;</button>
        <button onclick="insertSymbol('"')">"</button>
        <button onclick="insertSymbol('=')">=</button>
        <button onclick="insertSymbol('+')">+</button>
        <button onclick="insertSymbol('-')">−</button>
        <button onclick="insertSymbol('*')">*</button>
        <button onclick="insertSymbol('/')">/</button>
        <button onclick="insertSymbol('%')">%</button>
        <button onclick="insertSymbol('&amp;')">&amp;</button>
    </div>

    <button class="run" onclick="runCode()">▶ Run Code</button>

    <h3>Output:</h3>
    <pre id="output"></pre>

</div>

</body>
</html>
